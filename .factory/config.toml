# SoftTri factory configuration. Edit freely; `factory config check` validates it.
# Generated by `factory init` on 2026-10-30. Init never overwrites this file.
schema_version = 1

# controlled: one approval per Deep feature, the backlog runs on `drain on`.
# autonomous: Deep plans approved by the agent (the independent verifier still
#   gates them) and the backlog runs item after item; push, destructive git and
#   items marked 'needs approval' still ask.
autonomy = "controlled"

# Verification commands, cheapest to most complete. {files} is replaced with the
# test files of the task at hand. A missing level is skipped and reported as such.
[gates]
focused = "npx vitest run --config config/testing/vitest.config.ts {files}"
quick = "npm run test:unit"
# `npm run test` also runs prettier/svelte-check (pre-existing backlog, non-blocking in CI)
# and Playwright (needs a display), so full/suite use the checks CI actually blocks on.
full = "npm run test:unit && (npm run --ignore-scripts=false build; s=$?; node scripts/cleanBuilds.js; exit $s)"
# `npm run lint` runs eslint --fix (rewrites files); CI's blocking gate is the build.
# --ignore-scripts=false: a user npmrc with ignore-scripts=true skips prebuild, which generates the prod tsconfigs.
# cleanBuilds.js restores public/index.html and removes build output (as `npm run release` does)
build = "(npm run --ignore-scripts=false build; s=$?; node scripts/cleanBuilds.js; exit $s)"
suite = "npm run test:unit && (npm run --ignore-scripts=false build; s=$?; node scripts/cleanBuilds.js; exit $s)"
# affected (optional, defaults to `focused`): a runner with {files} for the specs
# the run's diff can break. With it, Deep closes on affected + build and the full
# suite is owed before push ([affected] partial = false turns that off).

# Editing a matching path forces the Deep path, however small the change.
# Globs: ** any depth, * one segment; a pattern without "/" matches the file name.
[risk]
paths = [
  "**/.env*",                                  # secrets
  ".github/workflows/**",                      # infra
  "src/frontend/ai/llm/llmSession.ts",         # auth
  "src/server/remote/components/Auth.svelte",  # auth
]

[limits]
max_attempts = 3
max_parallel = 4
gate_timeout = 1800  # seconds; a gate running longer is killed and fails
max_mutations = 8  # per Deep verification (min 2); each reruns the mutated file's specs

# commit: block | warn | off — require passing gates before `git commit`.
# exempt: changes touching only these globs commit without a gate.
# ask_commands: extra command prefixes that always ask (e.g. a deploy script).
[guards]
commit = "block"
exempt = ["**/*.md", ".factory/**"]
ask_commands = []

# Shared files: a task touching one never runs in parallel with other tasks.
[parallel]
bottlenecks = [
  "**/package.json",
  "**/pyproject.toml",
  "**/go.mod",
  "**/Cargo.toml",
  "**/*.lock",
  "**/*lock.json",
  "**/*lock.yaml",
  "**/migrations/**",
]

# Model per role: sonnet | opus | haiku | fable | a full model id.
[models]
implementer = "sonnet"
escalation = "opus"
